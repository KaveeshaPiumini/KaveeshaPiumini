<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="Piumini Ranasinghe, Senior Software Engineer at WSO2" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9ff3ec"/>
    </linearGradient>
    <clipPath id="c"><rect width="1200" height="230" rx="18"/></clipPath>
    <style>
      .dot { fill: #5ee7df; animation: tw 3s ease-in-out infinite; }
      .d2 { animation-delay: .8s; } .d3 { animation-delay: 1.6s; } .d4 { animation-delay: 2.2s; }
      .wave { animation: drift 9s ease-in-out infinite alternate; }
      .name { font: 800 54px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1px; }
      .role { font: 500 21px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #cdeff1; letter-spacing: .5px; }
      .tag  { font: 600 14px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #5ee7df; letter-spacing: 2px; }
      @keyframes tw { 0%,100% { opacity: .25; } 50% { opacity: .9; } }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-60px); } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="230" fill="url(#g)"/>
    <!-- network motif -->
    <g stroke="#5ee7df" stroke-opacity=".18" stroke-width="1.2">
      <line x1="60" y1="40" x2="150" y2="95"/><line x1="150" y1="95" x2="90" y2="170"/><line x1="150" y1="95" x2="240" y2="60"/>
      <line x1="960" y1="50" x2="1050" y2="110"/><line x1="1050" y1="110" x2="1140" y2="60"/><line x1="1050" y1="110" x2="1110" y2="180"/><line x1="960" y1="50" x2="1140" y2="60"/>
    </g>
    <circle class="dot" cx="60" cy="40" r="4"/><circle class="dot d2" cx="150" cy="95" r="5"/>
    <circle class="dot d3" cx="90" cy="170" r="4"/><circle class="dot d4" cx="240" cy="60" r="3.5"/>
    <circle class="dot d2" cx="960" cy="50" r="4"/><circle class="dot" cx="1050" cy="110" r="5"/>
    <circle class="dot d3" cx="1140" cy="60" r="4"/><circle class="dot d4" cx="1110" cy="180" r="3.5"/>
    <!-- waves -->
    <g class="wave">
      <path d="M0 200 C150 175 300 225 450 200 C600 175 750 225 900 200 C1050 175 1200 225 1350 200 V240 H0 Z" fill="#5ee7df" fill-opacity=".08"/>
      <path d="M0 212 C150 195 300 232 450 212 C600 195 750 232 900 212 C1050 195 1200 232 1350 212 V240 H0 Z" fill="#5ee7df" fill-opacity=".1"/>
    </g>
    <!-- text -->
    <text class="tag" x="600" y="62" text-anchor="middle">IDENTITY · SECURITY · EDGE ML</text>
    <text class="name" x="600" y="122" text-anchor="middle" fill="url(#t)">Piumini Ranasinghe</text>
    <text class="role" x="600" y="160" text-anchor="middle">Senior Software Engineer @ WSO2  •  Identity &amp; Access Management</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
